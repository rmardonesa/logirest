<div class="acceso">
  <div class="acceso-contenido">
    <div class="acceso-marca">
      <p class="acceso-titulo">logirest</p>
      <p class="acceso-bajada">Registro y administracion de solicitudes</p>
    </div>

    <div class="acceso-tarjeta">
      <h1>Iniciar sesion</h1>
      <p class="acceso-instruccion">Ingresa tus credenciales para continuar</p>

      <form [formGroup]="formulario" (ngSubmit)="enviar()">
        <label class="acceso-campo">
          <span>Usuario</span>
          <input type="text" formControlName="usuario" autocomplete="username" />
        </label>

        <label class="acceso-campo">
          <span>Contrasena</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </label>

        @if (error(); as mensaje) {
          <p class="acceso-error" role="alert">{{ mensaje }}</p>
        }

        <button
          type="submit"
          class="acceso-boton"
          [disabled]="!formularioValido() || enviando()"
        >
          {{ enviando() ? 'Verificando...' : 'Ingresar' }}
        </button>
      </form>
    </div>

    <p class="acceso-pie">Dinnes SpA</p>
  </div>
</div>
